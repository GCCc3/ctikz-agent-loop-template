[project]
name = "dskt-mcp-server"
version = "0.2.0"
description = "MCP transport shim for the shared Dskt Pharo service"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0",
  "httpx>=0.27",
]

[project.scripts]
dskt-mcp-server = "dskt_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dskt_mcp_server"]
