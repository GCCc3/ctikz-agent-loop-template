[project]
name = "png-diagram-measure-mcp-server"
version = "0.1.0"
description = "MCP transport shim for the Pharo PNG diagram measurement service"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0",
  "httpx>=0.27",
]

[project.scripts]
png-diagram-measure-mcp-server = "png_diagram_measure_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["png_diagram_measure_mcp_server"]
